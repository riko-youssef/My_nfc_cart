<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUSSEF__NFC</title>
    <meta name="description" content="خدمات يوسف الأمين لتزويد المحلات والشركات بأحدث بطاقات الأعمال الذكية بتقنية NFC وشاشات QR Code التفاعلية فـ المغرب.">
    <link rel="icon" type="image/png" href="Youssefrr.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 30px 22px;
            border-radius: 28px;
            overflow: hidden;
            background:
                radial-gradient(circle at 15% 15%, rgba(255,215,120,.20), transparent 22%),
                radial-gradient(circle at 85% 20%, rgba(255,200,70,.15), transparent 25%),
                radial-gradient(circle at 50% 85%, rgba(255,220,120,.12), transparent 30%),
                linear-gradient(160deg,#1a1a1a 0%,#111111 35%,#090909 70%,#000000 100%);
            border: 2px solid rgba(255,215,90,.55);
            box-shadow:
                0 0 8px rgba(255,215,0,.20),
                0 0 18px rgba(255,200,0,.18),
                0 15px 45px rgba(0,0,0,.80),
                inset 0 1px 0 rgba(255,255,255,.05),
                inset 0 0 25px rgba(255,215,0,.08);
            backdrop-filter: blur(8px);
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .title {
            font-size: 14px;
            color: #d4af37;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .bio {
            font-size: 13px;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            border-right: 3px solid #d4af37;
            text-align: justify;
        }

        .badge-nfc {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            margin-bottom: 25px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-call {
            background: #222;
            color: #d4af37;
            border: 1px solid rgba(212,175,55,0.3);
        }

        .btn-whatsapp {
            background: #25d366 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        .contact-info-box {
            background: #141414;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #222;
            text-align: right;
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #222;
            text-decoration: none;
            color: #ddd;
            font-size: 13px;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-item i {
            color: #d4af37;
            font-size: 16px;
        }

        .gallery-title {
            font-size: 14px;
            color: #d4af37;
            margin-bottom: 10px;
            text-align: right;
            font-weight: 600;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .gallery-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #333;
            background: #1a1a1a;
        }

        /* ========== الأيقونات الفنية الملونة خصيصاً لكل منصة ========== */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 25px;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 21px;
            transition: transform 0.3s ease;
        }

        /* إنستغرام: مفتوح ومنور (تدرج وردي وبرتقالي فخم) */
        .social-btn.instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.5);
        }

        /* فيسبوك: أزرق ملكي مفتوح */
        .social-btn.facebook {
            background: #1877f2 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.5);
        }

        /* تيك توك: أسود مغموق وفخم مع إطار وخطوط نيون */
        .social-btn.tiktok {
            background: #000000 !important;
            color: #ff0050 !important;
            border: 2px solid #ff0050;
            box-shadow: 0 0 12px rgba(255, 0, 80, 0.4);
        }

        /* لينكد إن: أزرق رسمي مغموق وأنيق */
        .social-btn.linkedin {
            background: #0a66c2 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(10, 102, 194, 0.5);
        }

        .social-btn:hover {
            transform: scale(1.12);
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <img src="Logo_yossef.png" alt="Youssef El Amyn" class="profile-img">

        <div class="name">YOUSSEF EL AMYN</div>
        <div class="title">Entrepreneur & Digital Creator</div>

        <div class="bio">
            مرحباً بكم في صفحتي الخاصة بالأعمال. نسعى دائماً لتقديم أفضل الخدمات والحلول الاحترافية.
        </div>

        <div class="badge-nfc">
            <i class="fa-solid fa-wifi"></i> NFC Connected
        </div>

        <div class="action-grid">
            <a href="tel:+212638571166" class="btn-action btn-call">
                <i class="fa-solid fa-phone"></i> اتصال
            </a>
            <a href="https://wa.me/212776366828" class="btn-action btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> واتساب
            </a>
        </div>

        <div class="contact-info-box">
            <a href="tel:+212638571166" class="info-item">
                <span>06 38 57 11 66</span>
                <i class="fa-solid fa-mobile-screen"></i>
            </a>
            <a href="https://wa.me/212776366828" class="info-item">
                <span>07 76 36 68 28</span>
                <i class="fa-brands fa-whatsapp"></i>
            </a>
        </div>

        <div class="gallery-title"><i class="fa-solid fa-images"></i> معرض الصور</div>
        <div class="gallery-grid">
            <img src="Youssef3.png" alt="Gallery 1" class="gallery-img">
            <img src="Youssef09.png" alt="Gallery 2" class="gallery-img">
            <img src="Youssef00.png" alt="Gallery 3" class="gallery-img">
            <img src="Youssef8.png" alt="Gallery 4" class="gallery-img">
            <img src="Youssef7.png" alt="Gallery 5" class="gallery-img">
            <img src="images.png" alt="Gallery 6" class="gallery-img">
        </div>

        <!-- أزرار التواصل الملونة والمخصصة -->
        <div class="social-links">
            <a href="instagram://user?username=youssef_amin778" class="social-btn instagram" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.facebook.com/share/1FPWkXY6BF/" class="social-btn facebook" title="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://www.tiktok.com/@youssef_amin22" class="social-btn tiktok" title="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>
            <a href="https://www.linkedin.com/in/youssef-amin-54796941b" class="social-btn linkedin" title="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
        </div>

        <button class="btn-save" onclick="downloadVCard()">
            <i class="fa-solid fa-user-plus"></i> حفظ جهة الاتصال
        </button>
    </div>

    <script>
        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Youssef El Amyn
TITLE:Entrepreneur & Digital Creator
TEL;TYPE=CELL:+212638571166
TEL;TYPE=WA:+212776366828
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'YOUSSEF_EL_AMYN.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
