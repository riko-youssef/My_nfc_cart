<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI - المساعد الشخصي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .chat-container { width: 100%; max-width: 500px; background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; display: flex; flex-direction: column; height: 85vh; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .chat-header { padding: 15px; background-color: #21262d; border-bottom: 1px solid #30363d; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { color: #58a6ff; font-size: 1.1rem; }
        .status { color: #7ee787; font-size: 0.8rem; }
        .api-config { padding: 10px; background-color: #161b22; border-bottom: 1px solid #30363d; }
        .api-config input { width: 100%; padding: 10px; border: 1px solid #30363d; border-radius: 6px; background-color: #0d1117; color: #fff; text-align: center; font-size: 0.85rem; outline: none; }
        .api-config input:focus { border-color: #58a6ff; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .user-message { align-self: flex-start; background-color: #1f6feb; color: #fff; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-end; background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-bottom-left-radius: 2px; }
        .input-area { padding: 12px; border-top: 1px solid #30363d; display: flex; gap: 8px; background-color: #161b22; border-radius: 0 0 12px 12px; }
        .input-area input { flex: 1; padding: 10px 12px; border: 1px solid #30363d; border-radius: 6px; background-color: #0d1117; color: #fff; outline: none; }
        .input-area input:focus { border-color: #58a6ff; }
        .input-area button { padding: 10px 18px; background-color: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .input-area button:hover { background-color: #2ea043; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>🤖 JARVIS AI</h2>
        <span class="status">● متصل</span>
    </div>

    <div class="api-config">
        <input type="password" id="apiKeyInput" placeholder="أدخل Gemini API Key هنا..." onchange="saveApiKey()">
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot-message">السلام عليكم! أنا جارفيس المساعد الذكي ديالك. دخل الـ API Key الفوق وتكلم معايا بالدارجة.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="كتب الميساج هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // استرجاع الـ API Key إذا كان محفوظاً مسبقاً
    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }
    };

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gemini_api_key', key);
    }

    async function sendMessage() {
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiKey = apiKeyInput.value.trim();
        const userInput = document.getElementById('userInput');
        const text = userInput.value.trim();

        if (!apiKey) {
            alert('عافاك أدخل Gemini API Key الفوق الأول!');
            return;
        }
        
        if (!text) return;

        // حفظ المفتاح فـ المتصفح
        saveApiKey();

        // عرض رسالة المستخدم
        appendMessage(text, 'user-message');
        userInput.value = '';

        // إنشاء عنصر التفكير
        const loadingDiv = appendMessage('جاري التفكير...', 'bot-message');

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: "أنت مساعد شخصي ذكي اسمه JARVIS. جاوب دائماً بالدارجة المغربية بطريقة محترمة ومفيدة: " + text
                        }]
                    }]
                })
            });

            const data = await response.json();

            if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
                loadingDiv.innerText = data.candidates[0].content.parts[0].text;
            } else if (data.error) {
                loadingDiv.innerText = "خطأ فـ الـ API: " + (data.error.message || "تأكد من صحة المفتاح.");
            } else {
                loadingDiv.innerText = "وقع خطأ غير متوقع فـ الاستجابة.";
            }
        } catch (error) {
            loadingDiv.innerText = "مشكل فـ الاتصال بالشبكة! تأكد من الإنترنت ولا من الـ CORS فـ المتصفح.";
            console.error(error);
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
